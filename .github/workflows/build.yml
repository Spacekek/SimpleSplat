name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            mamba: osx-arm64
          - os: ubuntu-22.04 # the oldest glibc the .deb and .rpm then run on
            mamba: linux-64
          - os: windows-latest
            mamba: win-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Release tag matches the app version (src-tauri/Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"

      # The conda env, Brush's build and the app's don't fit in the runner's free space otherwise.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable # Brush needs Rust 1.95 or newer

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2 # license notices of the Rust crates
        with:
          tool: cargo-about

      - name: micromamba
        shell: bash
        run: |
          mkdir -p ~/micromamba && cd ~/micromamba
          curl -fsSL "https://micro.mamba.pm/api/micromamba/${{ matrix.mamba }}/latest" | tar -xj
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$PWD/Library/bin"; else echo "$PWD/bin"; fi >> "$GITHUB_PATH"

      # Brush is the slowest part of the tools to build (47 min on Windows), and changes only with its
      # pinned commit. Saved even when a later step fails, so a failed run doesn't build it again.
      - uses: actions/cache/restore@v4
        id: brush
        with:
          path: .cache/brush-*
          key: brush-${{ runner.os }}-${{ hashFiles('scripts/bundle_tools.py') }}
          restore-keys: brush-${{ runner.os }}-

      - run: npm ci
      # Builds the tools (scripts/bundle_tools.py), the frontend and the installers.
      - run: npx tauri build
      - uses: actions/cache/save@v4
        if: always() && steps.brush.outputs.cache-hit != 'true' && hashFiles('.cache/brush-*/bin/*') != ''
        with:
          path: .cache/brush-*
          key: ${{ steps.brush.outputs.cache-primary-key }}
      # After the build: compiling needs the tools folder and the frontend to exist.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: simplesplat-${{ matrix.mamba }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # A pushed tag like v0.2.0 publishes the installers as a GitHub release, which the app's update
  # notice then finds.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: find . -type f -exec gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes {} +
        env:
          GH_TOKEN: ${{ github.token }}
