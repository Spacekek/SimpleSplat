name: Build

# Release tags only (minutes on a private repo are limited); Run workflow in the Actions tab builds any branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            name: macos
          - os: ubuntu-24.04 # Spirula needs glibc 2.38, so older systems gain nothing
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Release tag matches the app version (src-tauri/Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true # a failing job would otherwise compile every crate again next time

      - uses: taiki-e/install-action@v2 # the Tauri CLI, and cargo-about for the license notices
        with:
          tool: tauri-cli,cargo-about

      # Downloads the tools (scripts/bundle_tools.py) and builds the installers.
      - run: cargo tauri build
      # After the build: compiling needs the tools folder to exist.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: simplesplat-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # A pushed tag like v0.2.0 publishes the installers as a GitHub release, which the app's update
  # notice then finds.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: find . -type f -exec gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes {} +
        env:
          GH_TOKEN: ${{ github.token }}
