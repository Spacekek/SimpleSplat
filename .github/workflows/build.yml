name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            mamba: osx-arm64
          - os: ubuntu-22.04 # the oldest glibc the .deb and .rpm then run on
            mamba: linux-64
          - os: windows-latest
            mamba: win-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable # Brush needs Rust 1.95 or newer

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: micromamba
        shell: bash
        run: |
          mkdir -p ~/micromamba && cd ~/micromamba
          curl -fsSL "https://micro.mamba.pm/api/micromamba/${{ matrix.mamba }}/latest" | tar -xj
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$PWD/Library/bin"; else echo "$PWD/bin"; fi >> "$GITHUB_PATH"

      # Brush is the slowest part of the tools to build, and changes only with its pinned commit.
      - uses: actions/cache@v4
        with:
          path: .cache/brush-*
          key: brush-${{ runner.os }}-${{ hashFiles('scripts/bundle_tools.py') }}
          restore-keys: brush-${{ runner.os }}-

      - run: npm ci
      # Builds the tools (scripts/bundle_tools.py), the frontend and the installers.
      - run: npx tauri build
      # After the build: compiling needs the tools folder and the frontend to exist.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: simplesplat-${{ matrix.mamba }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
