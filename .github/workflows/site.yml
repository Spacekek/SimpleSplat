name: Site

on:
  push:
    branches:
      - main
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
        - uses: actions/checkout@v4
        - uses: actions/upload-pages-artifact@v3
          with:
            path: site
        - uses: actions/deploy-pages@v4
