[package]
name = "simplesplat"
version = "0.1.0"
description = "Turn a video or photos into a Gaussian splat"
authors = ["Tsjerk Piter Walinga"]
license = "Apache-2.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The symlink feature lets a symlinked binary (Homebrew cask `binary`, `ln -s`) find its tools on
# macOS; the check it turns off guards self-relaunching apps, and this one never relaunches.
tauri = { version = "2", features = ["protocol-asset", "process-relaunch-dangerous-allow-symlink-macos"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
dirs = "7"
clap = { version = "4.6.7", features = ["derive"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
