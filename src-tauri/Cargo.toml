[package]
name = "simplesplat"
version = "0.1.0"
description = "Turn a video or photos into a Gaussian splat"
authors = ["Tsjerk Piter Walinga"]
license = "Apache-2.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
